spring:
  application:
    name: nurseflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5441/nurseflow}
    username: ${DB_USERNAME:nurseflow}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
info:
  app:
    name: NurseFlow
    version: 0.6.0

nurseflow:
  auth:
    jwt-secret-b64: ${JWT_SECRET_B64:}
    issuer: ${JWT_ISSUER:nurseflow-local}
    access-token-seconds: ${JWT_TTL_SECONDS:1800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
