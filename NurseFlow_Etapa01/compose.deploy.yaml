# Extension opcional del Compose EXISTENTE (proyecto nurseflow).
# Ejecutar SIEMPRE junto con compose.yaml; de esta forma se mantiene su volumen de PostgreSQL.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nurseflow}
      DB_USERNAME: ${DB_USERNAME:-nurseflow}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
      JWT_SECRET_B64: ${JWT_SECRET_B64:?Falta JWT_SECRET_B64 en .env}
      JWT_ISSUER: ${JWT_ISSUER:-nurseflow-local}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-1800}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
  web:
    build:
      context: ../NurseFlow_Frontend_Etapa05
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8088}:80"
